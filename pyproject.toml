[project]
name = "forecast-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "radu", email = "raduparaian@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chronos-forecasting>=2.3.1",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "torch>=2.13.0",
    "typer>=0.27.1",
    "xgboost>=3.2.0",
]

[project.scripts]
forecast-lab = "forecast_lab:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
